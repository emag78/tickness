<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Tickness</title>
  <style>
    body {
      background-color: #e6f0f7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      color: #222;
    }
    .app-icon {
      width: 100px;
      height: 100px;
      margin: 24px 0 16px;
    }
    h1 {
      font-size: 2em;
      font-weight: 700;
      margin: 0;
    }
    .tagline {
      font-size: 1.4em;
      font-weight: 700;
      line-height: 1.5;
      margin: 24px 0;
    }
    .share-text {
      font-size: 1.15em;
      margin-bottom: 20px;
      max-width: 420px;
    }
    .qr {
      width: 220px;
      max-width: 80%;
      margin-bottom: 28px;
    }
    .whatsapp-btn {
      background-color: #25D366;
      color: #fff;
      padding: 14px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 1.05em;
      font-weight: 600;
      margin-bottom: 16px;
      display: inline-block;
    }
    .back-link {
      font-size: 1em;
      color: #1a73e8;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <img src="tick.png" alt="Tickness App Icon" class="app-icon">

  <h1>TICKNESS</h1>

  <div class="tagline">
    Get organized.<br>
    Write it all down.<br>
    Free your mind.
  </div>

  <div class="share-text">
    Ask them to scan this QR code to quickly access and download Tickness.
  </div>

  <img src="tickness-qr-code.png" alt="Tickness QR code" class="qr">

  <a
    class="whatsapp-btn"
    href="https://wa.me/?text=I%20found%20Tickness%2C%20an%20app%20to%20get%20organized%20and%20free%20your%20mind.%20You%20can%20download%20it%20here%3A%20https%3A%2F%2Ftickness.com"
    target="_blank"
    rel="noopener noreferrer">
    Share on WhatsApp
  </a>

  <a href="index_en.html" class="back-link">← Back to home</a>

</body>
</html>
