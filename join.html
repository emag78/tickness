<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unisciti a Tickness</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    button {
      margin-top: 1rem;
      padding: .6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #2b73ff;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    button:hover {
      background: #1e5fe0;
    }
    button.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>Sincronizzazione Tickness</h1>
  <p>Stai per unirti a un canale di sincronizzazione Tickness.</p>
  <p>Se l'app Tickness è installata sul tuo dispositivo, si aprirà automaticamente.</p>

  <p id="status" style="color:#666; margin-top:1rem;"></p>
  <button id="openBtn">Apri manualmente in Tickness</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const inviteToken = params.get('inviteToken');
    const statusEl = document.getElementById('status');
    const button = document.getElementById('openBtn');

    function showInstallInfo() {
      document.body.insertAdjacentHTML('beforeend', `
        <p style="margin-top:1rem;color:#666">
          Se nulla si è aperto, assicurati che l'app <strong>Tickness</strong> sia installata.
        </p>

        <div style="margin-top:1.5rem; font-size:1rem; color:#444;">
          <strong>📲 Non hai ancora installato l’app?</strong><br>
          Puoi scaricarla qui:
        </div>

        <div class="store-badges" style="margin-top:1rem; text-align:center;">
          <a href="https://apps.apple.com/it/app/tickness/id6749477728"
             target="_blank" rel="noopener noreferrer">
            <img src="app-store-badge-it.svg"
                 alt="Scarica su App Store"
                 style="height:55px; margin:6px;">
          </a>

          <a href="https://play.google.com/store/apps/details?id=com.enricomagrella.tickness"
             target="_blank" rel="noopener noreferrer">
            <img src="google-play-badge-it.svg"
                 alt="Disponibile su Google Play"
                 style="height:55px; margin:6px;">
          </a>
        </div>
      `);
    }

    function redirectToApp(deepLink) {
      statusEl.textContent = "⏳ Tentativo di apertura in corso...";
      window.location.href = deepLink;

      setTimeout(() => {
        statusEl.textContent = "⚠️ Se l'app non si è aperta automaticamente, prova qui sotto:";
        button.classList.add('visible');
        button.onclick = () => (window.location.href = deepLink);
        showInstallInfo();
      }, 2000);
    }

    if (inviteToken && inviteToken.trim().length > 0) {
      const deepLink = `tickness://join?inviteToken=${encodeURIComponent(inviteToken.trim())}`;
      redirectToApp(deepLink);
    } else {
      statusEl.textContent = "❌ Link di invito non valido o incompleto.";
      showInstallInfo();
    }
  </script>
</body>
</html>
