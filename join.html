<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Tickness</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    button {
      margin-top: 1rem;
      padding: .6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #2b73ff;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    button:hover {
      background: #1e5fe0;
    }
    button.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>Tickness Synchronization</h1>
  <p>You are about to join a Tickness synchronization channel.</p>
  <p>If the Tickness app is installed on your device, it should open automatically.</p>

  <p id="status" style="color:#666; margin-top:1rem;"></p>
  <button id="openBtn">Open Tickness manually</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const inviteToken = params.get('inviteToken');
    const statusEl = document.getElementById('status');
    const button = document.getElementById('openBtn');

    function showInstallInfo() {
      document.body.insertAdjacentHTML('beforeend', `
        <p style="margin-top:1rem;color:#666">
          If nothing opened, make sure the <strong>Tickness</strong> app is installed.
        </p>

        <div style="margin-top:1.5rem; font-size:1rem; color:#444;">
          <strong>📲 Don’t have the app yet?</strong><br>
          Download it here:
        </div>

        <div class="store-badges" style="margin-top:1rem; text-align:center;">
          <a href="https://apps.apple.com/it/app/tickness/id6749477728"
             target="_blank" rel="noopener noreferrer">
            <img src="app-store-badge.svg"
                 alt="Download on the App Store"
                 style="height:55px; margin:6px;">
          </a>

          <a href="https://play.google.com/store/apps/details?id=com.enricomagrella.tickness"
             target="_blank" rel="noopener noreferrer">
            <img src="google-play-badge.svg"
                 alt="Get it on Google Play"
                 style="height:55px; margin:6px;">
          </a>
        </div>
      `);
    }

    function redirectToApp(deepLink) {
      statusEl.textContent = "⏳ Attempting to open the app...";
      window.location.href = deepLink;

      setTimeout(() => {
        statusEl.textContent = "⚠️ If the app did not open automatically, try below:";
        button.classList.add('visible');
        button.onclick = () => (window.location.href = deepLink);
        showInstallInfo();
      }, 2000);
    }

    if (inviteToken && inviteToken.trim().length > 0) {
      const deepLink = `tickness://join?inviteToken=${encodeURIComponent(inviteToken.trim())}`;
      redirectToApp(deepLink);
    } else {
      statusEl.textContent = "❌ Invalid or incomplete invitation link.";
      showInstallInfo();
    }
  </script>
</body>
</html>
