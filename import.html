<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importa in Tickness</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    code {
      display: block;
      margin-top: 1rem;
      background: #eee;
      padding: .5rem 1rem;
      border-radius: 6px;
      font-size: .9rem;
      overflow-wrap: anywhere;
    }
    button {
      margin-top: 1rem;
      padding: .6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #2b73ff;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    button:hover {
      background: #1e5fe0;
    }
    button.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>Importazione dati su Tickness</h1>
  <p>Se l'app Tickness è installata sul tuo dispositivo, si aprirà automaticamente.</p>
  <p id="status" style="color:#666; margin-top:1rem;"></p>
  <button id="openBtn">Apri manualmente in Tickness</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const data = params.get('data');
    const statusEl = document.getElementById('status');
    const button = document.getElementById('openBtn');

    function normalizeBase64(s) {
      if (!s) return null;
      return s.trim().replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    }

    function isValidBase64(str) {
      if (!str) return false;
      const normalized = normalizeBase64(str);
      if (normalized.length % 4 !== 0) return false;
      try {
        atob(normalized);
        return true;
      } catch {
        return false;
      }
    }

    function sanitizePayload(base64) {
      try {
        const decoded = atob(base64);
        const json = JSON.parse(decoded);

        // azzera categories se esiste
        if (Array.isArray(json.categories)) {
          json.categories = [];
        }

        // anche se è dentro payload o livelli più profondi
        if (json.payload && Array.isArray(json.payload.categories)) {
          json.payload.categories = [];
        }

        // ri-serializza
        return btoa(JSON.stringify(json));
      } catch {
        return base64; // fallback se qualcosa va storto
      }
    }

    if (!data) {
      statusEl.textContent = "❌ Nessun parametro 'data' trovato.";
    } else if (!isValidBase64(data)) {
      statusEl.textContent = "⚠️ Il link di importazione sembra incompleto.";
      document.body.insertAdjacentHTML('beforeend', `
        <p style="margin-top:1rem;color:#666;max-width:480px;">
          Torna alla chat dell'assistente <strong>Tickness</strong> e attendi che 
          scompaia il pulsante rosso <strong>“Stop”</strong> prima di cliccare di nuovo il link.  
          Così sarai sicuro che il link sia stato generato completamente ✅
        </p>
      `);
    } else {
      const normalized = normalizeBase64(data);
      const sanitized = sanitizePayload(normalized);
      const deepLink = `tickness://import?data=${encodeURIComponent(sanitized)}`;

      statusEl.textContent = "⏳ Tentativo di apertura in corso...";
      window.location.href = deepLink;

      // mostra pulsante manuale dopo 2 secondi
      setTimeout(() => {
        statusEl.textContent = "⚠️ Se l'app non si è aperta automaticamente, prova qui sotto:";
        button.classList.add('visible');
        button.onclick = () => (window.location.href = deepLink);

        document.body.insertAdjacentHTML('beforeend', `
          <p style="margin-top:1rem;color:#666">
            Se nulla si è aperto, assicurati che l'app <strong>Tickness</strong> sia installata e riprova.
          </p>
        `);
      }, 2000);
    }
  </script>
</body>
</html>
