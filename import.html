<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importa in Tickness</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    code {
      display: block;
      margin-top: 1rem;
      background: #eee;
      padding: .5rem 1rem;
      border-radius: 6px;
      font-size: .9rem;
      overflow-wrap: anywhere;
    }
    button {
      margin-top: 1rem;
      padding: .6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #2b73ff;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #1e5fe0;
    }
  </style>
</head>
<body>
  <h1>Importazione dati su Tickness</h1>
  <p>Se l'app Tickness è installata sul tuo dispositivo, si aprirà automaticamente.</p>
  <p id="deepLink"></p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const data = params.get('data');
    const deepLinkEl = document.querySelector('#deepLink');

    function normalizeBase64(s) {
      if (!s) return null;
      return s
        .trim()
        .replace(/\s+/g, '')    // rimuove spazi e newline
        .replace(/-/g, '+')     // compatibilità URL-safe
        .replace(/_/g, '/');
    }

    function isValidBase64(str) {
      if (!str) return false;
      const normalized = normalizeBase64(str);
      if (normalized.length % 4 !== 0) return false;
      try {
        atob(normalized);
        return true;
      } catch {
        return false;
      }
    }

    if (!data) {
      deepLinkEl.textContent = "❌ Nessun parametro 'data' trovato.";
    } else if (!isValidBase64(data)) {
      deepLinkEl.textContent = "⚠️ Il link di importazione sembra incompleto.";
      document.body.insertAdjacentHTML('beforeend', `
        <p style="margin-top:1rem;color:#666;max-width:480px;">
          Torna alla chat dell'assistente <strong>Tickness</strong> e attendi che 
          scompaia il pulsante rosso <strong>“Stop”</strong> prima di cliccare di nuovo il link.  
          Così sarai sicuro che il link sia stato generato completamente ✅
        </p>
      `);
    } else {
      const normalized = normalizeBase64(data);
      const deepLink = `tickness://import?data=${encodeURIComponent(normalized)}`;

      // Mostra feedback immediato
      const message = document.createElement('p');
      message.textContent = "⏳ Tentativo di apertura in corso...";
      message.style.color = "#666";
      document.body.appendChild(message);

      // Tenta apertura automatica
      window.location.href = deepLink;

      // Fallback dopo 2 secondi
      setTimeout(() => {
        message.textContent = "⚠️ Se l'app non si è aperta automaticamente, puoi provare manualmente:";
        const button = document.createElement('button');
        button.textContent = "Apri in Tickness";
        button.onclick = () => (window.location.href = deepLink);
        document.body.appendChild(button);

        document.body.insertAdjacentHTML('beforeend', `
          <p style="margin-top:1rem;color:#666">
            Se nulla si è aperto, assicurati che l'app <strong>Tickness</strong> sia installata e riprova.
          </p>
        `);
      }, 2000);
    }
  </script>
</body>
</html>
