<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import into Tickness</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    code {
      display: block;
      margin-top: 1rem;
      background: #eee;
      padding: .5rem 1rem;
      border-radius: 6px;
      font-size: .9rem;
      overflow-wrap: anywhere;
    }
    button {
      margin-top: 1rem;
      padding: .6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #2b73ff;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    button:hover {
      background: #1e5fe0;
    }
    button.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>Data Import into Tickness</h1>
  <p>If the Tickness app is installed on your device, it should open automatically.</p>
  <p id="status" style="color:#666; margin-top:1rem;"></p>
  <button id="openBtn">Open Tickness manually</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const data = params.get('data');
    const guid = params.get('id');
    const statusEl = document.getElementById('status');
    const button = document.getElementById('openBtn');

    function normalizeBase64(s) {
      if (!s) return null;
      return s.trim().replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    }

    function isValidBase64(str) {
      if (!str) return false;
      const normalized = normalizeBase64(str);
      if (normalized.length % 4 !== 0) return false;
      try {
        atob(normalized);
        return true;
      } catch {
        return false;
      }
    }

    function sanitizePayload(base64) {
      try {
        const decoded = atob(base64);
        const json = JSON.parse(decoded);
        if (Array.isArray(json.categories)) json.categories = [];
        if (json.payload && Array.isArray(json.payload.categories)) {
          json.payload.categories = [];
        }
        return btoa(JSON.stringify(json));
      } catch {
        return base64;
      }
    }

    function openInAppWithData(base64) {
      const sanitized = sanitizePayload(normalizeBase64(base64));
      const deepLink = `tickness://import?data=${encodeURIComponent(sanitized)}`;
      redirectToApp(deepLink);
    }

    function openInAppWithGuid(guid) {
      const deepLink = `tickness://import?id=${encodeURIComponent(guid)}`;
      redirectToApp(deepLink);
    }

    function showInstallInfo() {
      document.body.insertAdjacentHTML('beforeend', `
        <p style="margin-top:1rem;color:#666">
          If nothing opened, make sure the <strong>Tickness</strong> app is installed.
        </p>

        <div style="margin-top:1.5rem; font-size:1rem; color:#444;">
          <strong>📲 Don’t have the app yet?</strong><br>
          Download it here:
        </div>

        <div class="store-badges" style="margin-top:1rem; text-align:center;">
          <a href="https://apps.apple.com/it/app/tickness/id6749477728"
             target="_blank" rel="noopener noreferrer">
            <img src="app-store-badge.svg"
                 alt="Download on the App Store"
                 style="height:55px; margin:6px;">
          </a>

          <a href="https://play.google.com/store/apps/details?id=com.enricomagrella.tickness"
             target="_blank" rel="noopener noreferrer">
            <img src="google-play-badge.svg"
                 alt="Get it on Google Play"
                 style="height:55px; margin:6px;">
          </a>
        </div>
      `);
    }

    function redirectToApp(deepLink) {
      statusEl.textContent = "⏳ Attempting to open the app...";
      window.location.href = deepLink;

      setTimeout(() => {
        statusEl.textContent = "⚠️ If the app did not open automatically, try below:";
        button.classList.add('visible');
        button.onclick = () => (window.location.href = deepLink);
        showInstallInfo();
      }, 2000);
    }

    if (data) {
      if (!isValidBase64(data)) {
        statusEl.textContent = "⚠️ The import link appears incomplete.";
        showInstallInfo();
      } else {
        openInAppWithData(data);
      }

    } else if (guid) {
      openInAppWithGuid(guid);

    } else {
      statusEl.textContent = "❌ No 'data' or 'id' parameter found.";
    }
  </script>
</body>
</html>
